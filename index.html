<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Video Hub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#0b0d12;
    color:white;
}

header{
    background:#11141b;
    padding:15px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid #292d36;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#ff4d6d;
    margin-bottom:12px;
}

.search{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #333;
    background:#1b1e26;
    color:white;
    font-size:16px;
}

nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 0;
}

nav button{
    background:#1b1e26;
    color:white;
    border:1px solid #333;
    padding:9px 15px;
    border-radius:20px;
    white-space:nowrap;
}

.container{
    padding:15px;
    max-width:1200px;
    margin:auto;
}

h2{
    margin:10px 0 18px;
}

.videos{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.card{
    background:#151820;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #252933;
}

.thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:linear-gradient(135deg,#252b3a,#101217);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.info{
    padding:10px;
}

.title{
    font-size:15px;
    font-weight:bold;
    line-height:1.3;
}

.views{
    color:#8e94a3;
    font-size:12px;
    margin-top:7px;
}

.ad{
    margin:20px 0;
    height:90px;
    border:1px dashed #555;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
}

@media(min-width:700px){
    .videos{
        grid-template-columns:repeat(4,1fr);
    }

    header{
        padding:18px 5%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎬 MY VIDEO HUB</div>

    <input
      class="search"
      type="text"
      id="search"
      placeholder="Search videos..."
      onkeyup="searchVideos()"
    >

    <nav>
        <button onclick="showAll()">All</button>
        <button onclick="filterVideos('Funny')">Funny</button>
        <button onclick="filterVideos('Kids')">Kids</button>
        <button onclick="filterVideos('Gaming')">Gaming</button>
        <button onclick="filterVideos('Music')">Music</button>
    </nav>
</header>

<div class="container">

    <div class="ad">ADVERTISEMENT</div>

    <h2>🔥 Latest Videos</h2>

    <div class="videos" id="videoList">

        <div class="card" data-title="Funny Cartoon" data-category="Funny">
            <div class="thumbnail">▶️</div>
            <div class="info">
                <div class="title">Funny Cartoon Video</div>
                <div class="views">1.2K views</div>
            </div>
        </div>

        <div class="card" data-title="Kids ABC Learning" data-category="Kids">
            <div class="thumbnail">🔤</div>
            <div class="info">
                <div class="title">Kids ABC Learning</div>
                <div class="views">850 views</div>
            </div>
        </div>

        <div class="card" data-title="Gaming Highlights" data-category="Gaming">
            <div class="thumbnail">🎮</div>
            <div class="info">
                <div class="title">Gaming Highlights</div>
                <div class="views">2.4K views</div>
            </div>
        </div>

        <div class="card" data-title="Music Video" data-category="Music">
            <div class="thumbnail">🎵</div>
            <div class="info">
                <div class="title">Music Video</div>
                <div class="views">3.1K views</div>
            </div>
        </div>

    </
